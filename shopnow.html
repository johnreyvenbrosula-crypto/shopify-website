<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopify2</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fraunces:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --surface2: #F0EDE6;
      --border: rgba(0,0,0,0.10);
      --border2: rgba(0,0,0,0.18);
      --text: #1A1814;
      --text2: #6B6860;
      --text3: #A09E98;
      --accent: #D94F2B;
      --accent2: #B33D1E;
      --gold: #B87D2F;
      --radius: 14px;
      --radius-sm: 8px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(247,245,240,0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .logo em { color: var(--accent); font-style: italic; }

    .search-wrap { flex: 1; position: relative; }
    .search-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text3);
    }
    .search-wrap input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid var(--border2);
      border-radius: 999px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(217,79,43,0.12);
    }

    .header-actions { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }

    .icon-btn {
      position: relative;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border2);
      background: var(--surface);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text);
      transition: background 0.15s;
    }
    .icon-btn:hover { background: var(--surface2); }

    .cart-badge {
      position: absolute;
      top: -4px; right: -4px;
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      border-radius: 999px;
      min-width: 18px;
      height: 18px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px;
      border: 2px solid var(--bg);
    }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #1A1814 60%, #2E2620);
      color: #fff;
      padding: 56px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 70% 50%, rgba(217,79,43,0.25) 0%, transparent 65%);
      pointer-events: none;
    }
    .hero-inner { max-width: 600px; margin: 0 auto; position: relative; }
    .hero-eyebrow {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(217,79,43,0.12);
      border: 1px solid rgba(217,79,43,0.3);
      border-radius: 999px;
      padding: 4px 14px;
      margin-bottom: 18px;
    }
    .hero h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(28px, 5vw, 46px);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .hero h1 em { color: var(--accent); font-style: italic; }
    .hero p { font-size: 15px; color: rgba(255,255,255,0.65); margin-bottom: 28px; }
    .hero-btn {
      display: inline-block;
      padding: 13px 32px;
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: 'DM Sans', sans-serif;
      transition: background 0.2s, transform 0.15s;
    }
    .hero-btn:hover { background: var(--accent2); transform: translateY(-2px); }

    /* CATEGORIES */
    .categories-section {
      max-width: 1200px;
      margin: 32px auto 0;
      padding: 0 24px;
    }

    .cat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .cat-pill {
      padding: 7px 18px;
      border-radius: 999px;
      border: 1px solid var(--border2);
      background: var(--surface);
      color: var(--text2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      font-family: 'DM Sans', sans-serif;
    }
    .cat-pill:hover { border-color: var(--accent); color: var(--accent); }
    .cat-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* MAIN */
    .main {
      max-width: 1200px;
      margin: 28px auto 60px;
      padding: 0 24px;
      display: flex;
      gap: 28px;
      align-items: flex-start;
    }

    /* PRODUCT GRID */
    .products-col { flex: 1; min-width: 0; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .results-count { font-size: 13px; color: var(--text2); }
    .sort-select {
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border2);
      background: var(--surface);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
    .sort-select:focus { border-color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.35s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card:hover {
      border-color: var(--border2);
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
    }
    .card-img {
      width: 100%;
      height: 130px;
      display: flex; align-items: center; justify-content: center;
      font-size: 50px;
      position: relative;
    }
    .card-badge {
      position: absolute;
      top: 8px; left: 8px;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.4px;
    }
    .badge-sale { background: #FDE8E4; color: #A32D2D; }
    .badge-new  { background: #E4F0FD; color: #185FA5; }
    .card-body { padding: 10px 12px 12px; }
    .card-cat { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 3px; }
    .card-name { font-size: 13px; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .price-block { display: flex; flex-direction: column; gap: 2px; }
    .card-price { font-size: 15px; font-weight: 600; }
    .card-rating { font-size: 11px; color: var(--gold); }
    .add-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border2);
      background: var(--surface);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s, transform 0.12s;
      flex-shrink: 0;
      line-height: 1;
      font-family: inherit;
    }
    .add-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(1.12); }
    .add-btn:active { transform: scale(0.94); }

    /* CART SIDEBAR */
    .cart-col {
      width: 280px;
      flex-shrink: 0;
      position: sticky;
      top: 80px;
    }
    .cart-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .cart-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .cart-head h3 { font-size: 15px; font-weight: 600; }
    .cart-clear {
      font-size: 12px;
      color: var(--text3);
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .cart-clear:hover { color: var(--accent); }
    .cart-body { max-height: 340px; overflow-y: auto; }
    .cart-body::-webkit-scrollbar { width: 4px; }
    .cart-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

    .empty-state { padding: 32px 16px; text-align: center; }
    .empty-state .empty-icon { font-size: 36px; margin-bottom: 10px; }
    .empty-state p { font-size: 13px; color: var(--text2); line-height: 1.6; }

    .cart-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .ci-emoji { font-size: 26px; flex-shrink: 0; }
    .ci-info { flex: 1; min-width: 0; }
    .ci-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ci-price { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .qty-ctrl { display: flex; align-items: center; gap: 4px; }
    .qty-btn {
      width: 22px; height: 22px;
      border-radius: 6px;
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s;
      font-family: inherit;
      line-height: 1;
    }
    .qty-btn:hover { background: var(--surface); border-color: var(--accent); color: var(--accent); }
    .qty-num { font-size: 13px; font-weight: 500; min-width: 16px; text-align: center; }

    .cart-foot { padding: 14px 16px; border-top: 1px solid var(--border); }
    .subtotal-row {
      display: flex; justify-content: space-between;
      font-size: 13px; color: var(--text2); margin-bottom: 6px;
    }
    .total-row {
      display: flex; justify-content: space-between;
      font-size: 16px; font-weight: 600; margin-bottom: 14px;
    }
    .checkout-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, transform 0.12s;
    }
    .checkout-btn:hover { background: var(--accent2); }
    .checkout-btn:active { transform: scale(0.98); }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1A1814;
      color: #F7F5F0;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
      z-index: 9999;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* PRODUCT MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      max-width: 480px;
      width: 100%;
      overflow: hidden;
      animation: popIn 0.2s ease;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.93); }
      to   { opacity: 1; transform: scale(1); }
    }
    .modal-img {
      width: 100%; height: 200px;
      display: flex; align-items: center; justify-content: center;
      font-size: 72px;
    }
    .modal-body { padding: 20px 24px 26px; }
    .modal-cat { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); margin-bottom: 6px; }
    .modal-name { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 700; margin-bottom: 10px; }
    .modal-desc { font-size: 14px; color: var(--text2); line-height: 1.65; margin-bottom: 18px; }
    .modal-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .modal-price { font-size: 26px; font-weight: 700; }
    .modal-rating { font-size: 14px; color: var(--gold); }
    .modal-actions { display: flex; gap: 10px; }
    .modal-add-btn {
      flex: 1;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s;
    }
    .modal-add-btn:hover { background: var(--accent2); }
    .modal-close-btn {
      padding: 13px 20px;
      border: 1px solid var(--border2);
      background: transparent;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s;
    }
    .modal-close-btn:hover { background: var(--surface2); }

    /* NO RESULTS */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 0;
      color: var(--text2);
      font-size: 14px;
    }
    .no-results span { font-size: 40px; display: block; margin-bottom: 12px; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .main { flex-direction: column; }
      .cart-col { width: 100%; position: static; }
      .cart-body { max-height: 220px; }
    }
    @media (max-width: 480px) {
      .header-inner { padding: 12px 14px; gap: 10px; }
      .main, .categories-section { padding: 0 14px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .hero { padding: 40px 16px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <a href="#" class="logo">Shop<em>Now</em></a>
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search for anything…" autocomplete="off" />
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="accountBtn" onclick="goToAccount()" title="Account" aria-label="Account">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
      <button class="icon-btn" onclick="toggleCart()" title="Toggle cart" aria-label="Open cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span class="cart-badge" id="cartBadge" style="display:none">0</span>
      </button>
    </div>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-inner">
    <span class="hero-eyebrow">✦ New Arrivals Daily</span>
    <h1>Everything you need,<br><em>delivered fast</em></h1>
    <p>Thousands of products across electronics, fashion, home &amp; sports — all in one place.</p>
    <button class="hero-btn" onclick="document.querySelector('.categories-section').scrollIntoView({behavior:'smooth'})">Shop Now</button>
  </div>
</section>

<!-- CATEGORIES -->
<section class="categories-section">
  <div class="cat-pills" id="catPills"></div>
</section>

<!-- MAIN -->
<div class="main">
  <div class="products-col">
    <div class="toolbar">
      <span class="results-count" id="resultsCount"></span>
      <select class="sort-select" id="sortSelect">
        <option value="default">Featured</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
        <option value="rating">Top Rated</option>
      </select>
    </div>
    <div class="grid" id="productGrid"></div>
  </div>

  <aside class="cart-col" id="cartCol" style="display:none">
    <div class="cart-box">
      <div class="cart-head">
        <h3>Your Cart</h3>
        <button class="cart-clear" onclick="clearCart()">Clear all</button>
      </div>
      <div class="cart-body" id="cartBody">
        <div class="empty-state">
          <div class="empty-icon">🛒</div>
          <p>Your cart is empty.<br>Add something!</p>
        </div>
      </div>
      <div class="cart-foot" id="cartFoot" style="display:none">
        <div class="subtotal-row"><span>Subtotal</span><span id="subtotalEl">$0.00</span></div>
        <div class="subtotal-row"><span>Shipping</span><span style="color:#3B6D11">Free</span></div>
        <div class="total-row"><span>Total</span><span id="totalEl">$0.00</span></div>
        <button class="checkout-btn" onclick="checkout()">Proceed to Checkout →</button>
      </div>
    </div>
  </aside>
</div>

<!-- PRODUCT MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-img" id="modalImg"></div>
    <div class="modal-body">
      <div class="modal-cat" id="modalCat"></div>
      <div class="modal-name" id="modalName"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-meta">
        <div class="modal-price" id="modalPrice"></div>
        <div class="modal-rating" id="modalRating"></div>
      </div>
      <div class="modal-actions">
        <button class="modal-add-btn" id="modalAddBtn">Add to Cart</button>
        <button class="modal-close-btn" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>

    { id:6,  name:"Sunglasses",             cat:"Fashion",     price:24.99,  rating:4.0, emoji:"🕶️", bg:"#F0F7EE", badge:"sale", desc:"Polarized UV400 sunglasses with lightweight metal frame in a timeless aviator style." },
    { id:7,  name:"Air Fryer",              cat:"Home",        price:89.99,  rating:4.8, emoji:"🍟", bg:"#FBF4E8", badge:"new",  desc:"5.8-quart digital air fryer with 8 preset cooking modes and dishwasher-safe basket." },
    { id:8,  name:"Dumbbell Set",           cat:"Sports",      price:44.99,  rating:4.4, emoji:"🏋️", bg:"#FBF0F4", badge:null,   desc:"Adjustable dumbbell set from 5–52 lbs with quick-select dial and storage tray." },
    { id:9,  name:"Mechanical Keyboard",    cat:"Electronics", price:109.99, rating:4.6, emoji:"⌨️", bg:"#EEF4FB", badge:"new",  desc:"TKL mechanical keyboard with Cherry MX switches, per-key RGB and USB-C connectivity." },
    { id:10, name:"Canvas Backpack",        cat:"Fashion",     price:34.99,  rating:4.1, emoji:"🎒", bg:"#F0F7EE", badge:null,   desc:"30L waxed canvas backpack with 15\" laptop sleeve, padded straps and water-resistant coating." },
    { id:11, name:"Table Lamp",             cat:"Home",        price:19.99,  rating:4.3, emoji:"💡", bg:"#FBF4E8", badge:null,   desc:"Minimalist LED table lamp with touch dimmer, 3 color temperatures and USB charging port." },
    { id:12, name:"Insulated Water Bottle", cat:"Sports",      price:14.99,  rating:4.5, emoji:"🍶", bg:"#FBF0F4", badge:null,   desc:"32oz stainless steel bottle that keeps drinks cold 24hrs or hot 12hrs. BPA-free lid." },
    { id:13, name:"Smart Watch",            cat:"Electronics", price:149.99, rating:4.7, emoji:"⌚", bg:"#EEF4FB", badge:"new",  desc:"Health-focused smartwatch with GPS, heart rate monitor, SpO2 sensor and 7-day battery." },
    { id:14, name:"Linen Shirt",            cat:"Fashion",     price:42.99,  rating:4.2, emoji:"👕", bg:"#F0F7EE", badge:null,   desc:"100% breathable linen button-up in a relaxed fit. Pre-washed for an effortlessly worn look." },
    { id:15, name:"Scented Candle Set",     cat:"Home",        price:28.99,  rating:4.6, emoji:"🕯️", bg:"#FBF4E8", badge:"sale", desc:"Set of 3 hand-poured soy wax candles — cedar, vanilla and eucalyptus, 40hr burn each." },
    { id:16, name:"Jump Rope",              cat:"Sports",      price:11.99,  rating:4.4, emoji:"🪢", bg:"#FBF0F4", badge:null,   desc:"Speed jump rope with ball-bearing handles, adjustable PVC cable and digital counter." },
  ];

  const categories = ["All", "Electronics", "Fashion", "Home", "Sports"];
  let activecat = "All";
  let cart = {};
  let cartVisible = false;

  function renderCats() {
    document.getElementById('catPills').innerHTML = categories.map(c =>
      `<button class="cat-pill${c === activecat ? ' active' : ''}" onclick="setcat('${c}')">${c}</button>`
    ).join('');
  }

  function setcat(c) { activecat = c; renderCats(); renderProducts(); }

  function starsHtml(r) {
    const full = Math.round(r);
    return '★'.repeat(full) + '☆'.repeat(5 - full) + ` <span style="color:var(--text2);font-size:10px">${r}</span>`;
  }

  function getFiltered() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const sort = document.getElementById('sortSelect').value;
    let list = products.filter(p =>
      (activecat === 'All' || p.cat === activecat) &&
      (!q || p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q))
    );
    if (sort === 'price-asc')  list.sort((a, b) => a.price - b.price);
    if (sort === 'price-desc') list.sort((a, b) => b.price - a.price);
    if (sort === 'rating')     list.sort((a, b) => b.rating - a.rating);
    return list;
  }

  function renderProducts() {
    const list = getFiltered();
    const grid = document.getElementById('productGrid');
    document.getElementById('resultsCount').textContent = list.length + ' products';

    if (!list.length) {
      grid.innerHTML = `<div class="no-results"><span>🔍</span>No products found. Try a different search or category.</div>`;
      return;
    }

    grid.innerHTML = list.map((p, i) => `
      <div class="card" style="animation-delay:${i * 35}ms" onclick="openModal(${p.id})">
        <div class="card-img" style="background:${p.bg}">
          ${p.badge ? `<span class="card-badge badge-${p.badge}">${p.badge === 'sale' ? '🔥 Sale' : '✦ New'}</span>` : ''}
          ${p.emoji}
        </div>
        <div class="card-body">
          <div class="card-cat">${p.cat}</div>
          <div class="card-name">${p.name}</div>
          <div class="card-footer">
            <div class="price-block">
              <div class="card-price">$${p.price.toFixed(2)}</div>
              <div class="card-rating">${starsHtml(p.rating)}</div>
            </div>
            <button class="add-btn" onclick="event.stopPropagation(); addToCart(${p.id})" title="Add to cart">+</button>
          </div>
        </div>
      </div>`
    ).join('');
  }

  function addToCart(id) {
    const p = products.find(x => x.id === id);
    if (!cart[id]) cart[id] = { product: p, qty: 0 };
    cart[id].qty++;
    updateCartUI();
    showToast(p.emoji + ' ' + p.name + ' added to cart');
  }

  function changeQty(id, delta) {
    if (!cart[id]) return;
    cart[id].qty += delta;
    if (cart[id].qty <= 0) delete cart[id];
    updateCartUI();
  }

  function clearCart() { cart = {}; updateCartUI(); }

  function updateCartUI() {
    const items = Object.values(cart);
    const total = items.reduce((s, i) => s + i.product.price * i.qty, 0);
    const count = items.reduce((s, i) => s + i.qty, 0);

    const badge = document.getElementById('cartBadge');
    badge.textContent = count;
    badge.style.display = count > 0 ? 'flex' : 'none';

    const body = document.getElementById('cartBody');
    const foot = document.getElementById('cartFoot');

    if (!items.length) {
      body.innerHTML = `<div class="empty-state"><div class="empty-icon">🛒</div><p>Your cart is empty.<br>Add something!</p></div>`;
      foot.style.display = 'none';
    } else {
      body.innerHTML = items.map(({ product: p, qty }) => `
        <div class="cart-item">
          <div class="ci-emoji">${p.emoji}</div>
          <div class="ci-info">
            <div class="ci-name">${p.name}</div>
            <div class="ci-price">$${(p.price * qty).toFixed(2)}</div>
          </div>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty(${p.id}, -1)">−</button>
            <span class="qty-num">${qty}</span>
            <button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button>
          </div>
        </div>`
      ).join('');
      document.getElementById('subtotalEl').textContent = '$' + total.toFixed(2);
      document.getElementById('totalEl').textContent = '$' + total.toFixed(2);
      foot.style.display = 'block';
    }
  }

  function toggleCart() {
    cartVisible = !cartVisible;
    document.getElementById('cartCol').style.display = cartVisible ? 'block' : 'none';
  }

  function checkout() {
    const count = Object.values(cart).reduce((s, i) => s + i.qty, 0);
    if (!count) { showToast('Your cart is empty!'); return; }
    showToast('🎉 Order placed! Thank you for shopping with ShopNow.');
    cart = {};
    updateCartUI();
  }

  function openModal(id) {
    const p = products.find(x => x.id === id);
    document.getElementById('modalImg').textContent = p.emoji;
    document.getElementById('modalImg').style.background = p.bg;
    document.getElementById('modalCat').textContent = p.cat;
    document.getElementById('modalName').textContent = p.name;
    document.getElementById('modalDesc').textContent = p.desc;
    document.getElementById('modalPrice').textContent = '$' + p.price.toFixed(2);
    document.getElementById('modalRating').innerHTML = starsHtml(p.rating);
    document.getElementById('modalAddBtn').onclick = () => { addToCart(p.id); closeModal(); };
    document.getElementById('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById('modalOverlay')) return;
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  document.getElementById('searchInput').addEventListener('input', renderProducts);
  document.getElementById('sortSelect').addEventListener('change', renderProducts);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  renderCats();
  renderProducts();

  // Account navigation
  function goToAccount() {
    const isLoggedIn = localStorage.getItem('shopnow_logged_in') === 'true';
    if (isLoggedIn) {
      window.location.href = 'account.html';
    } else {
      window.location.href = 'login.html';
    }
  }
</script>
</body>
</html>
